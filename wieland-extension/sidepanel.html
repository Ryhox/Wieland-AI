<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wieland AI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="stars-canvas"></canvas>
    <div class="home-ambient-glow"></div>

    <div id="auth-screen" class="screen">
      <div class="auth-card">
        <div class="auth-brand" id="auth-brand">WIELAND</div>
        <h2 class="auth-title" id="auth-title">Willkommen zurück</h2>
        <p class="auth-subtitle" id="auth-subtitle">
          Melde dich an, um Nachrichten zu senden
        </p>

        <div class="auth-tabs">
          <button class="auth-tab active" data-mode="login" id="auth-tab-login">
            Anmelden
          </button>
          <button class="auth-tab" data-mode="register" id="auth-tab-register">
            Registrieren
          </button>
        </div>

        <div class="auth-form" id="auth-form">
          <div class="auth-field hidden" id="field-username">
            <label id="label-username">Benutzername</label>
            <input
              type="text"
              id="input-username"
              placeholder="wieland_user"
              autocomplete="username"
            />
          </div>
          <div class="auth-field">
            <label id="label-email">E-Mail</label>
            <input
              type="email"
              id="input-email"
              placeholder="deine@email.de"
              autocomplete="email"
            />
          </div>
          <div class="auth-field">
            <label id="label-password">Passwort</label>
            <input
              type="password"
              id="input-password"
              placeholder="Mindestens 8 Zeichen"
              autocomplete="current-password"
            />
          </div>
          <div class="auth-field hidden" id="field-confirm">
            <label id="label-confirm">Passwort bestätigen</label>
            <input
              type="password"
              id="input-confirm"
              placeholder="••••••••"
              autocomplete="new-password"
            />
          </div>

          <p class="auth-error hidden" id="auth-error"></p>

          <button class="auth-submit" id="auth-submit">
            <span id="auth-submit-text">Anmelden</span>
            <span class="spinner hidden" id="auth-spinner"></span>
          </button>
        </div>

        <p class="auth-switch">
          <span id="auth-switch-text">Noch kein Konto?</span>
          <a href="#" id="auth-switch-link">Registrieren</a>
        </p>
      </div>

      <!-- Legal Button -->
      <button class="ext-legal-button" id="btn-legal" title="Rechtliches">
        <svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
          <path d="M250 30 L390 30 L450 90 L450 290 L250 290 Z" fill="none" stroke="white" strokeWidth="6" strokeLinejoin="round" strokeLinecap="round"/>
          <path d="M390 30 L390 90 L450 90" fill="none" stroke="white" strokeWidth="6" strokeLinejoin="round"/>
          <line x1="282" y1="160" x2="418" y2="160" stroke="white" strokeWidth="5" strokeLinecap="round"/>
          <line x1="282" y1="195" x2="418" y2="195" stroke="white" strokeWidth="5" strokeLinecap="round"/>
          <line x1="282" y1="230" x2="355" y2="230" stroke="white" strokeWidth="5" strokeLinecap="round"/>
        </svg>
        <span class="ext-legal-label" id="legal-label">Rechtliches</span>
      </button>
    </div>

    <!-- Legal Modal -->
    <div id="legal-modal" class="legal-modal-backdrop hidden">
      <div class="legal-modal" onclick="event.stopPropagation()">
        <div class="legal-modal-header">
          <h2 id="legal-modal-title">Rechtliches</h2>
          <button class="legal-modal-close" id="legal-modal-close" title="Schließen">&#10005;</button>
        </div>
        <div class="legal-modal-body">
          <nav class="legal-modal-links">
            <a href="#" class="legal-modal-link" data-page="legal-notice" id="legal-option-notice">Impressum</a>
            <a href="#" class="legal-modal-link" data-page="privacy-policy" id="legal-option-privacy">Datenschutz</a>
            <a href="#" class="legal-modal-link" data-page="terms-of-service" id="legal-option-terms">Nutzungsbedingungen</a>
          </nav>
        </div>
      </div>
    </div>

    <div id="chat-screen" class="screen hidden">
      <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>

      <aside id="sidebar" class="sidebar">
        <button
          class="sidebar-hamburger"
          id="btn-close-sidebar"
          title="Menü schließen"
        >
          <svg fill="none" viewBox="0 0 50 50" height="28" width="28">
            <path
              class="lineTop line"
              stroke-linecap="round"
              stroke-width="4"
              stroke="white"
              d="M6 11L44 11"
            />
            <path
              class="lineMid line"
              stroke-linecap="round"
              stroke-width="4"
              stroke="white"
              d="M6 24H43"
            />
            <path
              class="lineBottom line"
              stroke-linecap="round"
              stroke-width="4"
              stroke="white"
              d="M6 37H43"
            />
          </svg>
        </button>

        <div class="sidebar-top-actions">
          <button
            class="sidebar-action-btn"
            id="btn-new-chat"
            title="Neuer Chat"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z" />
            </svg>
            <span id="txt-new-chat">Neuer Chat</span>
          </button>
        </div>

        <div class="sidebar-chats">
          <p class="sidebar-section-label" id="txt-your-chats">Deine Chats</p>
          <div id="chat-list" class="chat-list">
            <p class="no-chats" id="txt-no-chats">Keine Chats vorhanden</p>
          </div>
        </div>

        <div class="sidebar-bottom">
          <div class="sidebar-profile" id="sidebar-profile">
            <div class="sidebar-avatar" id="sidebar-avatar">??</div>
            <div class="sidebar-profile-info">
              <span class="sidebar-name" id="sidebar-name">—</span>
              <span class="sidebar-plan" id="sidebar-plan">Free</span>
            </div>
            <button class="sidebar-logout" id="btn-logout" title="Abmelden">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
            </button>
          </div>
        </div>
      </aside>

      <div class="chat-main">
        <header class="chat-header">
          <button
            class="header-sidebar-toggle"
            id="btn-toggle-sidebar"
            title="Menü"
          >
            <svg fill="none" viewBox="0 0 50 50" height="28" width="28">
              <path
                class="lineTop line"
                stroke-linecap="round"
                stroke-width="4"
                stroke="white"
                d="M6 11L44 11"
              />
              <path
                class="lineMid line"
                stroke-linecap="round"
                stroke-width="4"
                stroke="white"
                d="M6 24H43"
              />
              <path
                class="lineBottom line"
                stroke-linecap="round"
                stroke-width="4"
                stroke="white"
                d="M6 37H43"
              />
            </svg>
          </button>
          <a href="#" class="header-logo" id="header-logo" title="Neuer Chat">
            <span class="header-logo-name">Wieland</span>
          </a>
          <div class="header-right">
            <button class="model-btn" id="btn-model">
              <span id="model-label">2B · Free</span>
              <svg
                class="model-btn-arrow"
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </button>
            <div class="model-dropdown hidden" id="model-dropdown">
              <button class="model-option active" data-model="qwen3-vl:4b-instruct">
                <svg class="model-icon" viewBox="0 0 200 200" width="14" height="14"><defs><radialGradient id="dwarfGrad"><stop offset="0%" stop-color="#fff8e1"/><stop offset="100%" stop-color="#ff8f00"/></radialGradient></defs><circle cx="100" cy="100" r="60" fill="url(#dwarfGrad)"/></svg>
                Dwarf
              </button>
              <button class="model-option" data-model="qwen3-vl:8b-instruct">
                <svg class="model-icon" viewBox="0 0 200 200" width="14" height="14"><defs><radialGradient id="starGrad"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f9a825"/></radialGradient></defs><circle cx="100" cy="100" r="70" fill="url(#starGrad)"/></svg>
                Star
              </button>
              <button class="model-option" data-model="qwen3-vl:8b-instruct-max">
                <svg class="model-icon" viewBox="0 0 200 200" width="14" height="14"><defs><radialGradient id="superGrad"><stop offset="0%" stop-color="#fff3e0"/><stop offset="100%" stop-color="#bf360c"/></radialGradient></defs><circle cx="100" cy="100" r="80" fill="url(#superGrad)"/></svg>
                Supergiant
              </button>
            </div>
          </div>
        </header>

        <main id="messages-area" class="messages-area">
          <div class="welcome-container" id="welcome-container">
            <span class="welcome-text" id="welcome-text"
              >Wobei kann ich dir heute helfen?</span
            >
          </div>
        </main>

        <div class="input-container">
          <div class="image-preview-bar hidden" id="image-preview-bar">
            <div class="image-pill" id="image-pill">
              <div class="image-pill-thumb">
                <img id="image-preview-img" src="" alt="" />
              </div>
              <div class="image-pill-meta">
                <span class="image-pill-name" id="image-pill-name"
                  >Bild.jpg</span
                >
                <span class="image-pill-type">Bild</span>
              </div>
              <button class="image-pill-remove" id="btn-remove-image">✕</button>
            </div>
          </div>

          <div class="plus-menu hidden" id="plus-menu">
            <button class="plus-menu-item" id="btn-upload-image">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <circle cx="8.5" cy="8.5" r="1.5" />
                <path d="M21 15l-5-5L5 21" />
              </svg>
              <span id="txt-upload-image">Bild hochladen</span>
            </button>
            <div class="plus-menu-divider"></div>
            <button class="plus-menu-item toggle-item" id="btn-toggle-internet">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="9" />
                <path d="M3 12h18" />
                <path d="M12 3a14.5 14.5 0 0 1 0 18" />
                <path d="M12 3a14.5 14.5 0 0 0 0 18" />
              </svg>
              <span id="txt-internet-access">Internet nutzen</span>
            </button>
            <div class="plus-menu-divider"></div>
            <p class="plus-menu-section-title" id="txt-style-section">
              KI-Stil
            </p>
            <button class="plus-menu-item" data-style="formal">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="8" width="18" height="12" rx="2" />
                <path d="M12 4v4" />
                <circle cx="9" cy="14" r="1" />
                <circle cx="15" cy="14" r="1" /></svg
              ><span id="txt-style-formal">KI-Stil: Formell</span>
            </button>
            <button class="plus-menu-item" data-style="friendly">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="8" width="18" height="12" rx="2" />
                <path d="M12 4v4" />
                <circle cx="9" cy="14" r="1" />
                <circle cx="15" cy="14" r="1" /></svg
              ><span id="txt-style-friendly">KI-Stil: Freundlich</span>
            </button>
            <button class="plus-menu-item" data-style="precise">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z" /></svg
              ><span id="txt-style-precise">KI-Stil: Präzise</span>
            </button>
          </div>

          <input
            type="file"
            id="file-input"
            accept="image/*"
            style="display: none"
          />

          <div class="input-row">
            <button class="input-icon-btn" id="btn-plus" title="Optionen">
              <svg
                class="plus-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              <svg
                class="pencil-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <path d="M12 20h9" />
                <path
                  d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4 12.5-12.5z"
                />
              </svg>
            </button>

            <textarea
              id="chat-input"
              placeholder="Schreibe eine Nachricht…"
              rows="1"
            ></textarea>

            <button
              class="input-icon-btn send-btn"
              id="btn-send"
              disabled
              title="Senden"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <line x1="12" y1="19" x2="12" y2="5" />
                <polyline points="5 12 12 5 19 12" />
              </svg>
            </button>
            <button
              class="input-icon-btn stop-btn hidden"
              id="btn-stop"
              title="Stoppen"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="6" y="6" width="12" height="12" />
              </svg>
            </button>
          </div>

          <div
            id="clarify-popup"
            class="clarify-popup hidden"
            aria-hidden="true"
          >
            <div
              class="clarify-popup-card"
              role="dialog"
              aria-label="Kurze Rückfrage"
            >
              <div class="clarify-popup-head">
                <h3 id="clarify-popup-question">Kurze Rückfrage</h3>
              </div>
              <div
                id="clarify-popup-step"
                class="clarify-popup-step hidden"
              ></div>
              <div
                id="clarify-popup-options"
                class="clarify-popup-options"
              ></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
